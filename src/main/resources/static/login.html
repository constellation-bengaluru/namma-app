<!DOCTYPE html>
<div id="login-container">
    <h1>Login</h1>
    <div id="login-error" class="error-message hidden"></div>
    <form id="login-form" onsubmit="return false;">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <button type="submit" id="loginButton" class="btn">Login</button>
        </div>
    </form>
    <div class="login-help">
        <p>Use the following credentials to login:</p>
        <code>Username: admin | Password: password</code>
    </div>
</div>

<style>
    #login-container {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    #login-container h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    
    .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }
    
    .btn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
    }
    
    .btn:hover {
        background-color: #45a049;
    }
    
    .error-message {
        color: red;
        margin-bottom: 15px;
        text-align: center;
    }
    
    .hidden {
        display: none;
    }
    
    .login-help {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
        text-align: center;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('login-form');
    const loginButton = document.getElementById('loginButton');
    const loginError = document.getElementById('login-error');
    
    loginForm.addEventListener('submit', function() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        const userData = {
            username: username,
            password: password
        };
        
        loginButton.disabled = true;
        loginButton.textContent = 'Logging in...';
        
        // Use the existing AJAX functions defined in vulnerableApp.js
        doPostAjaxCall(
            function(response) {
                // Handle successful login
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
                loginError.classList.add('hidden');
                
                if (response.status === 'success') {
                    // Update UI or redirect
                    window.location.href = '/VulnerableApp';
                } else {
                    // Handle error response
                    loginError.textContent = response.message || 'Login failed. Please try again.';
                    loginError.classList.remove('hidden');
                }
            }, 
            '/login', 
            true, 
            JSON.stringify(userData)
        );
        
        // Explicitly handle errors since our AJAX doesn't support it well
        setTimeout(function() {
            if (loginButton.textContent === 'Logging in...') {
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
                loginError.textContent = 'Login failed. Please check your credentials.';
                loginError.classList.remove('hidden');
            }
        }, 3000);
        
        return false;
    });
});
</script>
